name: Release

on:
  push:
    tags: ["v*"]
    # Pushes to main run the full release build as a dry run; only tags publish.
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build universal app (ad-hoc signed)
        run: |
          xcodebuild -project AndroidUSBTethering.xcodeproj \
            -scheme AndroidUSBTethering -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build

      - name: Verify bundle
        id: version
        run: |
          APP=build/Build/Products/Release/AndroidUSBTethering.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/AndroidUSBTethering"
          lipo -archs "$APP/Contents/MacOS/AndroidUSBTetheringHelper"
          test -f "$APP/Contents/Library/LaunchDaemons/com.aedkymish.AndroidUSBTethering.helper.plist"
          test -f "$APP/Contents/Resources/Scripts/install-helper.sh"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP=build/Build/Products/Release/AndroidUSBTethering.app
          mkdir -p dist dmg
          ditto -c -k --keepParent "$APP" "dist/AndroidUSBTethering-$VERSION.zip"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Android USB Tethering $VERSION" -srcfolder dmg -ov -format UDZO \
            "dist/AndroidUSBTethering-$VERSION.dmg"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $VERSION" >&2; exit 1; }
          sed "s/VERSION/$VERSION/g" .github/release-notes-install.md >> notes.md
          cat notes.md

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Android USB Tethering $VERSION" \
            --notes-file notes.md \
            --prerelease

      - name: Update Homebrew cask
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA=$(shasum -a 256 "dist/AndroidUSBTethering-$VERSION.dmg" | cut -d ' ' -f 1)
          # Commit as the author of the tagged commit.
          AUTHOR_NAME=$(git log -1 --format=%an)
          AUTHOR_EMAIL=$(git log -1 --format=%ae)
          git fetch --depth=1 origin main
          git switch --detach FETCH_HEAD
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            Casks/android-usb-tethering.rb
          if git diff --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git -c user.name="$AUTHOR_NAME" -c user.email="$AUTHOR_EMAIL" \
            commit -am "Homebrew cask: android-usb-tethering $VERSION"
          git push origin HEAD:main
