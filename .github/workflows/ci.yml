name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: TetheringCore (build + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  driver-codec:
    name: DriverKit RNDIS codec (C++ tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I Driver \
            Driver/RNDISCodec.cpp Driver/Tests/RNDISCodecTests.cpp -o codec-tests
          ./codec-tests

  app:
    name: App + Helper + Driver (xcodebuild)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build default app (no DriverKit)
        run: |
          xcodebuild -project AndroidUSBTethering.xcodeproj \
            -scheme AndroidUSBTethering -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ! test -e build/Build/Products/Debug/AndroidUSBTethering.app/Contents/Library/SystemExtensions
          test -f build/Build/Products/Debug/AndroidUSBTethering.app/Contents/Resources/AppIcon.icns
      - name: Build DriverKit app
        run: |
          xcodebuild -project AndroidUSBTethering.xcodeproj \
            -scheme AndroidUSBTetheringDriverKit -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-dk CODE_SIGNING_ALLOWED=NO build
          find build-dk/Build/Products/Debug/AndroidUSBTethering.app/Contents -maxdepth 3 | sort
