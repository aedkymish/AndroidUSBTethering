name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: TetheringCore (build + tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app:
    name: App + Helper (xcodebuild)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project AndroidUSBTethering.xcodeproj \
            -scheme AndroidUSBTethering -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
